      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="-1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/><stop offset="0.5" stop-color="#67E8F9"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/><animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="violetGlow"><stop stop-color="#7C3AED" stop-opacity=".26"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyanGlow"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="greenGlow"><stop stop-color="#10B981" stop-opacity=".12"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".075"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".025"/></linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".1"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#67E8F9" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>

    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".38"/></filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .035"/></feComponentTransfer></filter>

    <mask id="type1"><rect width="0" height="40" fill="white"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;.12;.18;.2;1" dur="18s" repeatCount="indefinite"/></rect></mask>
    <mask id="type2"><rect width="0" height="40" fill="white"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;.12;.18;.2;1" dur="18s" begin="3.6s" repeatCount="indefinite"/></rect></mask>
    <mask id="type3"><rect width="0" height="40" fill="white"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;.12;.18;.2;1" dur="18s" begin="7.2s" repeatCount="indefinite"/></rect></mask>
    <mask id="type4"><rect width="0" height="40" fill="white"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;.12;.18;.2;1" dur="18s" begin="10.8s" repeatCount="indefinite"/></rect></mask>
    <mask id="type5"><rect width="0" height="40" fill="white"><animate attributeName="width" values="0;360;360;0;0" keyTimes="0;.12;.18;.2;1" dur="18s" begin="14.4s" repeatCount="indefinite"/></rect></mask>
