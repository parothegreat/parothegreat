<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Moehammad Alvaro Pirata Prayogo developer profile</title>
  <desc id="desc">Animated terminal profile for a systems administrator and infrastructure security enthusiast.</desc>
  <defs>
    <clipPath id="frame"><rect width="1180" height="610" rx="28"/></clipPath>
    <clipPath id="leftPanel"><rect x="34" y="34" width="420" height="542" rx="22"/></clipPath>
    <clipPath id="terminal"><rect x="478" y="34" width="668" height="542" rx="22"/></clipPath>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/><stop offset="0.5" stop-color="#0B1120"/><stop offset="1" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
