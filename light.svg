<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Alvaro Prayogo — systems and infrastructure</title>
  <desc id="desc">An animated technical profile featuring an ASCII portrait derived from profile.jpeg.</desc>
  <defs>
    <clipPath id="frame"><rect width="1180" height="500" rx="18"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F7FAF9"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F7F5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0F9F8F"/><stop offset=".55" stop-color="#059669"/><stop offset="1" stop-color="#B56B00"/>
      <animate attributeName="x1" values="0;.25;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;.75;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0F9F8F" stop-opacity="0"/><stop offset=".5" stop-color="#0F9F8F" stop-opacity=".16"/><stop offset="1" stop-color="#0F9F8F" stop-opacity="0"/>
    </linearGradient>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" seed="11"/><feComponentTransfer><feFuncA type="table" tableValues="0 .025"/></feComponentTransfer></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="roleMask"><rect x="0" y="0" width="0" height="28" fill="white"><animate attributeName="width" values="0;405;405;0" keyTimes="0;.28;.86;1" dur="7s" repeatCount="indefinite"/></rect></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F172A" stroke-opacity=".025"/></pattern>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1180" height="500" fill="url(#bg)"/>
    <rect width="1180" height="500" fill="url(#grid)"/>
    <rect width="1180" height="500" filter="url(#noise)" opacity=".5"/>

    <rect x="18.5" y="18.5" width="1143" height="463" rx="11.5" fill="none" stroke="#CBD5E1"/>
    <rect x="18.5" y="18.5" width="1143" height="463" rx="11.5" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="160 1100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-1260" dur="10s" repeatCount="indefinite"/>
    </rect>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="40" y="48" fill="#64748B" font-size="10" letter-spacing="1.5">PAROTHEGREAT / PROFILE.SYS</text>
      <circle cx="1118" cy="44" r="4" fill="#059669" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle>
      <text x="1104" y="48" fill="#64748B" font-size="9" text-anchor="end">ONLINE</text>
      <line x1="40" y1="64" x2="1140" y2="64" stroke="#CBD5E1"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="54" y="91" fill="#64748B" font-size="9" letter-spacing="1.2">PORTRAIT / LUMA MAP</text>
      <text x="384" y="91" fill="#475569" font-size="9" text-anchor="end">profile.jpeg</text>
      <g xml:space="preserve" font-size="12.5" font-weight="700" fill="url(#accent)" filter="url(#glow)">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="5.5s" repeatCount="indefinite"/>
        <text x="58" y="118">    ....::----====----::::........</text>
        <text x="58" y="134">    ...:::--+*####*+--:::::.......</text>
        <text x="58" y="150">       ..:-%*=-..:-*#.:......  ...</text>
        <text x="58" y="166">          -%--.  . :*...          </text>
        <text x="58" y="182">        ..:-..:::.  ::......      </text>
        <text x="58" y="198">         .::: ....  .-::..::..    </text>
        <text x="58" y="214">        . .:-----::-::-:::::::..  </text>
        <text x="58" y="230">        .:-+#:... =*=--::-::::.:  </text>
        <text x="58" y="246">    :=+#%@@#=#%+*#@-%@%##*+-::....</text>
        <text x="58" y="262"> ..#@@@@@@@@# =@@@. @@@@@@@%=-::..</text>
        <text x="58" y="278">:.#@@@@@@@@@@@ :@+ %*+*=%@@@@*---:</text>
        <text x="58" y="294">:-@@@@@@@@@@@@@=-:#@#*#+@@@@@%=--:</text>
        <text x="58" y="310">:+@@@@#*@@@@@@@@ -@@@@@@@@@@@@#-=-</text>
        <text x="58" y="326">-*%*==--.*@@@@@@+%@@@@@@@@*+=-==-=</text>
        <text x="58" y="342">==     ...*@@@@#=*+=:...:=:    .==</text>
        <text x="58" y="358">+=. ..:..  ....       .. .:.    ==</text>
      </g>
      <rect x="48" y="96" width="366" height="24" fill="url(#scan)"><animate attributeName="y" values="96;348;96" dur="5s" repeatCount="indefinite"/></rect>
      <line x1="54" y1="378" x2="398" y2="378" stroke="#CBD5E1"/>
      <text x="54" y="400" fill="#475569" font-size="10">SOURCE  768×863 / GRAYSCALE / 32 COL</text>
    </g>

    <line x1="438" y1="84" x2="438" y2="421" stroke="#CBD5E1"/>
    <g font-family="ui-sans-serif, system-ui, sans-serif">
      <text x="476" y="104" fill="#B56B00" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.6">SYSTEMS / INFRASTRUCTURE / SECURITY</text>
      <text x="474" y="174" fill="#0F172A" font-size="55" font-weight="800" letter-spacing="0">ALVARO</text>
      <text x="474" y="230" fill="#0F172A" font-size="55" font-weight="300" letter-spacing="0">PRAYOGO</text>
      <rect x="477" y="247" width="44" height="3" fill="#0F9F8F"/>
      <g transform="translate(476 277)" mask="url(#roleMask)">
        <text y="0" fill="#0F9F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">JUNIOR SYSTEMS ADMINISTRATOR</text>
      </g>
      <rect x="895" y="259" width="8" height="21" fill="#B56B00"><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        <text x="476" y="322" fill="#64748B">LOCATION</text><text x="565" y="322" fill="#334155">CIKARANG, INDONESIA</text>
        <text x="820" y="322" fill="#64748B">STATUS</text><text x="890" y="322" fill="#059669">OPEN TO WORK</text>
        <text x="476" y="349" fill="#64748B">FOCUS</text><text x="565" y="349" fill="#334155">LINUX / NETWORKS / MONITORING</text>
        <text x="820" y="349" fill="#64748B">ORG</text><text x="890" y="349" fill="#334155">TEAMITMIVHS</text>
      </g>

      <line x1="476" y1="376" x2="1124" y2="376" stroke="#CBD5E1"/>
      <text x="476" y="400" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.3">WORKING SET</text>
      <text x="476" y="421" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">LINUX  ·  GO  ·  DOCKER  ·  NGINX  ·  POSTGRES  ·  GRAFANA</text>
    </g>

    <rect x="18" y="441" width="1144" height="41" fill="#0F172A" fill-opacity=".025"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">
      <text x="40" y="466" fill="#0F9F8F">parothegreat.site</text>
      <text x="280" y="466" fill="#475569">github.com/parothegreat</text>
      <text x="570" y="466" fill="#475569">Cikarang Selatan / UTC+7</text>
      <text x="1140" y="466" fill="#B56B00" text-anchor="end">BUILD USEFUL THINGS.</text>
    </g>
  </g>
</svg>
