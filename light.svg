<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Alvaro Prayogo live system profile</title>
  <desc id="desc">Animated terminal card with an ASCII portrait and systems profile information.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAFCFC"/><stop offset=".55" stop-color="#F1F5F4"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"><animate attributeName="stop-color" values="#0F766E;#0284C7;#059669;#0F766E" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset=".62" stop-color="#059669"><animate attributeName="stop-color" values="#059669;#0F766E;#B56B00;#059669" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#B56B00"><animate attributeName="stop-color" values="#B56B00;#059669;#0284C7;#B56B00" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0F766E" stop-opacity="0"/><stop offset=".5" stop-color="#0891B2" stop-opacity=".45"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#0891B2" opacity=".035"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".12"/></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="9"/><feComponentTransfer><feFuncA type="table" tableValues="0 .02"/></feComponentTransfer></filter>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .key { fill:#0F766E; font-weight:700; }
      .value { fill:#1E293B; }
      .dots { fill:#94A3B8; }
      .section { fill:#B56B00; font-weight:700; }
      text, tspan { white-space:pre; }
    </style>
  </defs>

  <rect width="1180" height="610" rx="18" fill="url(#bg)"/>
  <rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>
  <rect width="1180" height="610" rx="18" filter="url(#noise)" opacity=".42"/>

  <g class="mono">
    <rect x="3" y="3" width="1174" height="35" rx="15" fill="#FFFFFF" fill-opacity=".92"/>
    <circle cx="25" cy="20" r="5" fill="#F87171"/><circle cx="43" cy="20" r="5" fill="#FBBF24"/><circle cx="61" cy="20" r="5" fill="#34D399"/>
    <text x="590" y="25" fill="#64748B" font-size="12" text-anchor="middle">parothegreat@fedora ~ % ./profile.sh --live</text>
    <circle cx="1098" cy="20" r="4" fill="#059669" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="1110" y="24" fill="#0F766E" font-size="10" letter-spacing="1">ONLINE</text>
  </g>

  <g transform="translate(0 38)" filter="url(#shadow)">
    <rect x="14" y="26" width="488" height="506" rx="14" fill="#FFFFFF" fill-opacity=".64" stroke="url(#accent)" stroke-opacity=".42"/>
    <rect x="508" y="10" width="655" height="538" rx="14" fill="#FFFFFF" fill-opacity=".68" stroke="url(#accent)" stroke-opacity=".42"/>
  </g>

  <g class="mono">
    <text x="30" y="61" fill="#0284C7" opacity=".72" font-size="11" letter-spacing="2">VISUAL.MAP</text>
    <text x="524" y="61" fill="#0284C7" opacity=".72" font-size="11" letter-spacing="2">SYSTEM.INFO</text>

    <g xml:space="preserve" font-size="12" font-weight="700" fill="url(#accent)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="6s" repeatCount="indefinite"/>
      <text x="47" y="105">    ....::----====----::::........</text>
      <text x="47" y="123">    ...:::--+*####*+--:::::.......</text>
      <text x="47" y="141">       ..:-%*=-..:-*#.:......  ...</text>
      <text x="47" y="159">          -%--.  . :*...          </text>
      <text x="47" y="177">        ..:-..:::.  ::......      </text>
      <text x="47" y="195">         .::: ....  .-::..::..    </text>
      <text x="47" y="213">        . .:-----::-::-:::::::..  </text>
      <text x="47" y="231">        .:-+#:... =*=--::-::::.:  </text>
      <text x="47" y="249">    :=+#%@@#=#%+*#@-%@%##*+-::....</text>
      <text x="47" y="267"> ..#@@@@@@@@# =@@@. @@@@@@@%=-::..</text>
      <text x="47" y="285">:.#@@@@@@@@@@@ :@+ %*+*=%@@@@*---:</text>
      <text x="47" y="303">:-@@@@@@@@@@@@@=-:#@#*#+@@@@@%=--:</text>
      <text x="47" y="321">:+@@@@#*@@@@@@@@ -@@@@@@@@@@@@#-=-</text>
      <text x="47" y="339">-*%*==--.*@@@@@@+%@@@@@@@@*+=-==-=</text>
      <text x="47" y="357">==     ...*@@@@#=*+=:...:=:    .==</text>
      <text x="47" y="375">+=. ..:..  ....       .. .:.    ==</text>
      <text x="47" y="393">++-.                ....        =+</text>
      <text x="47" y="411">++=:         .--::.    .....::.-++</text>
      <text x="47" y="429">+*+-=+**###%%@@@=:-*%%%%%@#+****++</text>
      <text x="47" y="447">**+=#@@@@@@@@@@@@#@@@@@@@@%***+*+*</text>
    </g>
    <rect x="30" y="72" width="455" height="38" fill="url(#scan)" opacity=".65"><animate attributeName="y" values="72;456;72" dur="4.8s" repeatCount="indefinite"/></rect>
    <line x1="31" y1="474" x2="485" y2="474" stroke="#CBD5E1"/>
    <text x="31" y="495" fill="#64748B" font-size="10">SOURCE: profile.jpeg / 768×863 / GRAYSCALE</text>
    <text x="31" y="516" fill="#0F766E" font-size="10">SCAN: COMPLETE</text>

    <g font-size="14.5">
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin=".3s" fill="freeze"/><text x="524" y="91" class="section">parothegreat@fedora</text><text x="720" y="91" class="dots"> ───────────────────────────</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin=".5s" fill="freeze"/><text x="524" y="120" class="key">Subject</text><text x="595" y="120" class="dots"> ............ </text><text x="710" y="120" class="value">Moehammad Alvaro Prayogo</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin=".7s" fill="freeze"/><text x="524" y="147" class="key">Role</text><text x="566" y="147" class="dots"> ............... </text><text x="710" y="147" class="value">Junior Systems Administrator</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin=".9s" fill="freeze"/><text x="524" y="174" class="key">Origin</text><text x="584" y="174" class="dots"> ............. </text><text x="710" y="174" class="value">Cikarang Selatan, Indonesia</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="1.1s" fill="freeze"/><text x="524" y="201" class="key">Education</text><text x="612" y="201" class="dots"> ......... </text><text x="710" y="201" class="value">Industrial Electronic Eng.</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="1.3s" fill="freeze"/><text x="524" y="228" class="key">Status</text><text x="584" y="228" class="dots"> ............. </text><text x="710" y="228" fill="#059669">Building · Learning · Shipping</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="1.5s" fill="freeze"/><text x="524" y="255" class="key">Toolchain</text><text x="604" y="255" class="dots"> ......... </text><text x="710" y="255" class="value">Fedora, Git, Docker, Neovim</text></g>

      <text x="524" y="296" class="section">- Core Systems ───────────────────────────────</text>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="1.8s" fill="freeze"/><text x="524" y="326" class="key">Core.System</text><text x="628" y="326" class="dots"> ...... </text><text x="710" y="326" class="value">Linux, systemd, Nginx, Docker</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="2s" fill="freeze"/><text x="524" y="353" class="key">Core.Network</text><text x="636" y="353" class="dots"> ..... </text><text x="710" y="353" class="value">TCP/IP, DNS, VLAN, MikroTik</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="2.2s" fill="freeze"/><text x="524" y="380" class="key">Core.Backend</text><text x="636" y="380" class="dots"> ..... </text><text x="710" y="380" class="value">Go, TypeScript, Python, REST</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="2.4s" fill="freeze"/><text x="524" y="407" class="key">Core.Data</text><text x="611" y="407" class="dots"> ........ </text><text x="710" y="407" class="value">MariaDB, PostgreSQL, Redis</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="2.6s" fill="freeze"/><text x="524" y="434" class="key">Core.Observe</text><text x="636" y="434" class="dots"> ..... </text><text x="710" y="434" class="value">Prometheus, Grafana, HTTP checks</text></g>

      <text x="524" y="475" class="section">- Contact ────────────────────────────────────</text>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="2.9s" fill="freeze"/><text x="524" y="505" class="key">Grid.Mail</text><text x="605" y="505" class="dots"> ......... </text><text x="710" y="505" class="value">alvaroprayogo38@gmail.com</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="3.1s" fill="freeze"/><text x="524" y="532" class="key">Grid.Web</text><text x="598" y="532" class="dots"> .......... </text><text x="710" y="532" class="value">parothegreat.site</text></g>
      <g><animate attributeName="opacity" values=".25;1" dur=".4s" begin="3.3s" fill="freeze"/><text x="524" y="559" class="key">Grid.GitHub</text><text x="620" y="559" class="dots"> ...... </text><text x="710" y="559" class="value">github.com/parothegreat</text></g>
      <rect x="930" y="546" width="8" height="17" fill="#B56B00"><animate attributeName="opacity" values="1;0;1" dur=".9s" begin="3.3s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <rect y="-60" width="1180" height="60" fill="url(#scan)" opacity=".45"><animateTransform attributeName="transform" type="translate" from="0 -60" to="0 670" dur="4.4s" repeatCount="indefinite"/></rect>
  <rect x="3" y="3" width="1174" height="604" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".7"><animate attributeName="opacity" values=".42;.85;.42" dur="3.4s" repeatCount="indefinite"/></rect>
</svg>
