name: Activity panel

# Draws the README's activity panel from the public contribution calendar and publishes it to the
# "output" branch as a single commit that is replaced on every run. Nothing is committed to main,
# so the bot never shows up in this repository's history or contributors.
on:
  schedule:
    - cron: "17 21 * * *" # daily, 04:17 in Jakarta
  workflow_dispatch:
  push:
    paths:
      - assets/build.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install fonttools brotli
      - run: python assets/build.py activity out
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
      - name: Publish to the output branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Activity panel"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
